services:
  db:
    image: mysql:8.0
    container_name: mysql-gestor-mvp
    restart: always
    # Las credenciales se leen del archivo .env (ver .env.example)
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${DB_NAME:-gestor_mvp}
      MYSQL_USER: ${DB_USER:?Define DB_USER en .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    ports:
      # Solo accesible desde este computador, no desde la red
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
